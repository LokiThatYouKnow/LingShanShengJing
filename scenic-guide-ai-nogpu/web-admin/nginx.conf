# =============================================================================
# Admin 管理后台 — Nginx 配置（子路径部署版：站点挂在 /admin/ 下）
# 由宿主 nginx 以 proxy_pass http://127.0.0.1:5175（不带尾斜杠）转发 /admin/* 进来，
# 所以本容器只处理 /admin/* 路径。API 统一命名空间在 /admin/ 前缀下，再回写成后端真实路径。
# =============================================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 构建产物 COPY 到 html/admin，故 root 指向 html，location /admin/ 自然命中
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用（子路径 /admin/）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Spring Boot 管理 API：/admin/api/* → /api/* ----
    location /admin/api/ {
        rewrite ^/admin/api/(.*)$ /api/$1 break;
        proxy_pass http://scenic-springboot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # ---- Spring Boot 图片服务：/admin/spot-images/* → /api/spot-images/* ----
    location /admin/spot-images/ {
        rewrite ^/admin/spot-images/(.*)$ /api/spot-images/$1 break;
        proxy_pass http://scenic-springboot:8080;
        proxy_set_header Host $host;
    }

    # ---- Python AI/TTS 服务：/admin/tts-api/* → /api/* ----
    location /admin/tts-api/ {
        rewrite ^/admin/tts-api/(.*)$ /api/$1 break;
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---- 预生成数字人视频：/admin/sadtalker-videos/* → /sadtalker-videos/* ----
    location /admin/sadtalker-videos/ {
        rewrite ^/admin/sadtalker-videos/(.*)$ /sadtalker-videos/$1 break;
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SadTalker 服务：云端未部署，直接 404（前端已优雅降级为“服务离线”）----
    location /admin/sadtalker-api/ {
        return 404;
    }
}

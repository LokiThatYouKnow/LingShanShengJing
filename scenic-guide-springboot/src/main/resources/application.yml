server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: scenic-guide
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/scenic_guide_ai?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.scenic.guide.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: scenic-guide-ai-jwt-secret-key-2024-change-in-production-must-be-long
  expire: 604800

# 文件存储路径（支持环境变量覆盖，Docker 下自动使用 /app/ 路径）
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  static-dir: ${FILE_STATIC_DIR:./static}
  image-dir: ${FILE_IMAGE_DIR:d:/TalkingV2/图片}
  audio-dir: ${FILE_AUDIO_DIR:./static/audio}
  video-dir: ${FILE_VIDEO_DIR:./static/video}

# AI 服务配置
ai:
  python-service-url: ${AI_PYTHON_SERVICE_URL:http://localhost:8000}
  enabled: ${AI_ENABLED:false}

# 大模型 LLM 配置（智谱云）
llm:
  enabled: ${LLM_ENABLED:true}
  zhipu-api-key: ${ZHIPU_API_KEY:}   # 填入智谱API Key，或设环境变量 ZHIPU_API_KEY
  zhipu-api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions

# SadTalker本地数字人服务
sadtalker:
  service-url: ${SADTALKER_SERVICE_URL:http://localhost:8001}
  upload-dir: ${SADTALKER_UPLOAD_DIR:./uploads}
  output-dir: ${SADTALKER_OUTPUT_DIR:./output}
  model-dir: ${SADTALKER_MODEL_DIR:./checkpoints}

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.scenic.guide: debug
    org.springframework.security: warn
    org.mybatis: warn

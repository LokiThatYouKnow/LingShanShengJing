<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI数字人换装测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }
        h1 {
            color: #00d4ff;
            text-align: center;
        }
        .test-section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
        }
        .test-result {
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.5);
        }
        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .pending {
            background: rgba(255, 200, 0, 0.2);
            border: 1px solid rgba(255, 200, 0, 0.5);
        }
        pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #00b8e6;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        img {
            max-width: 200px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🤖 AI数字人换装测试</h1>
    
    <div class="test-section">
        <h2>测试 1: SadTalker 服务状态</h2>
        <div id="test1" class="test-result pending">测试中...</div>
    </div>

    <div class="test-section">
        <h2>测试 2: 上传头像图片</h2>
        <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/jpg">
        <select id="gender">
            <option value="female">女性（晓晓）</option>
            <option value="male">男性（云希）</option>
        </select>
        <br>
        <button id="uploadBtn" onclick="uploadAvatar()">上传头像</button>
        <div id="uploadResult"></div>
        <img id="previewImg" style="display:none;">
    </div>

    <div class="test-section">
        <h2>测试 3: 确认头像并生成视频</h2>
        <button id="confirmBtn" onclick="confirmAvatar()" disabled>确认并生成视频</button>
        <div id="confirmResult"></div>
        <div id="progress" style="display:none;">
            <div class="progress-bar" style="background:#333;height:20px;border-radius:10px;">
                <div id="progressFill" style="background:#00d4ff;height:100%;border-radius:10px;width:0%;transition:width 0.3s;"></div>
            </div>
            <span id="progressText">准备中...</span>
        </div>
    </div>

    <script>
        // 使用相对路径，通过 Vite 代理访问 SadTalker 服务
        const API_BASE = '';  // 空字符串表示同源，通过 Vite 代理
        
        let uploadedImagePath = '';
        
        // 测试 1: 检查服务状态
        fetch(API_BASE + '/avatar/current')
            .then(r => r.json())
            .then(data => {
                document.getElementById('test1').className = 'test-result success';
                document.getElementById('test1').innerHTML = '✅ SadTalker 服务正常<br><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(e => {
                document.getElementById('test1').className = 'test-result error';
                document.getElementById('test1').innerHTML = '❌ 服务未响应: ' + e.message + '<br><small>请确保通过 http://localhost:5174/avatar-test.html 访问此页面</small>';
            });

        // 测试 2: 上传头像
        async function uploadAvatar() {
            const fileInput = document.getElementById('avatarFile');
            const gender = document.getElementById('gender').value;
            const btn = document.getElementById('uploadBtn');
            const result = document.getElementById('uploadResult');
            
            if (!fileInput.files[0]) {
                result.innerHTML = '❌ 请选择图片';
                result.className = 'test-result error';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '上传中...';
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('gender', gender);
            
            try {
                const resp = await fetch(API_BASE + '/avatar/upload-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await resp.json();
                
                if (data.success) {
                    uploadedImagePath = data.image_path;
                    result.innerHTML = '✅ 上传成功！<br><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    result.className = 'test-result success';
                    
                    // 显示预览
                    const previewImg = document.getElementById('previewImg');
                    previewImg.src = data.image_url;  // 相对路径，通过 Vite 代理
                    previewImg.style.display = 'block';
                    
                    // 启用确认按钮
                    document.getElementById('confirmBtn').disabled = false;
                } else {
                    throw new Error(data.detail || '上传失败');
                }
            } catch (e) {
                result.innerHTML = '❌ 上传失败: ' + e.message + '<br><small>请确保 SadTalker 服务运行在 8001 端口</small>';
                result.className = 'test-result error';
            } finally {
                btn.disabled = false;
                btn.textContent = '上传头像';
            }
        }

        // 测试 3: 确认头像并生成视频
        async function confirmAvatar() {
            if (!uploadedImagePath) {
                alert('请先上传头像');
                return;
            }
            
            const gender = document.getElementById('gender').value;
            const btn = document.getElementById('confirmBtn');
            const result = document.getElementById('confirmResult');
            const progress = document.getElementById('progress');
            
            btn.disabled = true;
            progress.style.display = 'block';
            result.innerHTML = '';
            
            const formData = new FormData();
            formData.append('image_path', uploadedImagePath);
            formData.append('gender', gender);
            
            try {
                const resp = await fetch(API_BASE + '/avatar/confirm', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await resp.json();
                
                if (data.success) {
                    result.innerHTML = '✅ 全部视频生成成功！<br><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    result.className = 'test-result success';
                    document.getElementById('progressFill').style.width = '100%';
                    document.getElementById('progressText').textContent = '完成！';
                    alert('✅ 数字人换装完成！\n\n请刷新前端页面查看新形象。');
                } else {
                    throw new Error(data.detail || '生成失败');
                }
            } catch (e) {
                result.innerHTML = '❌ 生成失败: ' + e.message;
                result.className = 'test-result error';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

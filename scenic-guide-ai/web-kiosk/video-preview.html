<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开场白视频预览 - 新版</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00d4ff; margin-bottom: 10px; }
        .hint { color: #4ecca3; margin-bottom: 30px; font-size: 14px; }
        .video-container {
            width: 100%;
            max-width: 800px;
            background: #16213e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
        }
        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
        }
        .info h3 { color: #00d4ff; margin-top: 0; }
        .info p { margin: 8px 0; color: #ccc; }
        .warning {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 800px;
            text-align: center;
        }
    </style>
</head>

</html>

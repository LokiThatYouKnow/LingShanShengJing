# =============================================================================
# Kiosk 展览前端 — Nginx 配置（子路径部署版：站点挂在 /kiosk/ 下）
# 宿主 nginx 以 proxy_pass http://127.0.0.1:5174（不带尾斜杠）转发 /kiosk/* 进来，
# 本容器只处理 /kiosk/* 路径。fetch 请求已由前端自动加上 /kiosk 前缀。
# 注意：<img>/<video> 里的 /spot-images、/sadtalker-videos 是根路径资源，
#       不经过本容器，由宿主 nginx 直接转发到后端。
# =============================================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 构建产物 COPY 到 html/kiosk
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用（子路径 /kiosk/）
    location /kiosk/ {
        try_files $uri $uri/ /kiosk/index.html;
    }

    # ---- Python AI 后端：/kiosk/api/* → /api/* ----
    location /kiosk/api/ {
        rewrite ^/kiosk/api/(.*)$ /api/$1 break;
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # ---- Python 静态文件：/kiosk/static/* → /static/* ----
    location /kiosk/static/ {
        rewrite ^/kiosk/static/(.*)$ /static/$1 break;
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
    }

    # ---- 预生成数字人视频：/kiosk/sadtalker-videos/* → /sadtalker-videos/* ----
    location /kiosk/sadtalker-videos/ {
        rewrite ^/kiosk/sadtalker-videos/(.*)$ /sadtalker-videos/$1 break;
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Spring Boot 图片：/kiosk/spot-images/* → /api/spot-images/* ----
    location /kiosk/spot-images/ {
        rewrite ^/kiosk/spot-images/(.*)$ /api/spot-images/$1 break;
        proxy_pass http://scenic-springboot:8080;
        proxy_set_header Host $host;
    }

    # ---- SadTalker 相关接口：云端未部署，直接 404（前端已优雅降级）----
    location ~ ^/kiosk/(avatar|generate-opening|generate-idle|idle-videos|output)(/|$) {
        return 404;
    }

    # =========================================================================
    # 根路径代理（Docker 部署时 kiosk 独占 80 端口，前端 fetch /api/* 不带 /kiosk 前缀）
    # =========================================================================
    location /api/ {
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
    location /static/ {
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
    }
    location /spot-images/ {
        proxy_pass http://scenic-springboot:8080;
        proxy_set_header Host $host;
    }
    location /sadtalker-videos/ {
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /dialogue-videos/ {
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
    }
    location /output/ {
        proxy_pass http://scenic-backend:8000;
        proxy_set_header Host $host;
    }
    # avatar/confirm 等换装接口（本地开发用，云端 404）
    location ~ ^/(avatar|generate-opening|generate-idle|idle-videos)(/|$) {
        return 404;
    }
}
